<body data-page="contact">
<a href="#main" class="skip" style="position:absolute;left:-999px">Skip to content</a>
<div id="gigf-header"></div>
<section class="page-hero"><div class="wrap"><div class="crumbs"><a href="index.html" data-i18n="nav.home">Home</a> › <span data-i18n="page.contact"></span></div>
  <h2 data-i18n="page.contact"></h2><p>We would love to hear from you.</p></div><div class="hero-badge-hang"><img src="assets/logo-emblem.svg" alt=""></div></section>
<main id="main">
<section class="section"><div class="wrap"><div class="grid g4" id="contactTiles"></div></div></section>
<section class="section alt"><div class="wrap"><div class="grid g2" style="align-items:start">
 <div class="card card-body"><h3 style="color:var(--primary-dark);margin-bottom:12px" data-i18n="btn.send"></h3>
  <form id="contactForm" class="f-grid" novalidate>
   <div class="field"><label><span data-i18n="f.name"></span> *</label><input name="name"><span class="err">Please enter your name</span></div>
   <div class="field"><label data-i18n="f.phone"></label><input name="phone" inputmode="tel"><span class="err">Enter a valid 10-digit mobile</span></div>
   <div class="field f-full"><label><span data-i18n="f.email"></span> *</label><input name="email" type="email"><span class="err">Enter a valid email</span></div>
   <div class="field f-full"><label data-i18n="f.subject"></label><select name="subject"><option>General enquiry</option><option>CSR / corporate partnership</option><option>Goshala visit</option><option>Organise a plantation in my area</option><option>Volunteer opportunities</option></select></div>
   <div class="field f-full"><label><span data-i18n="f.message"></span> *</label><textarea name="message" rows="4"></textarea><span class="err">Please write at least 10 characters</span></div>
   <button class="btn btn-primary f-full" type="submit" data-i18n="btn.send"></button></form><div id="contactResult" style="margin-top:12px"></div></div>
 <iframe id="map" class="map" title="Office location map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div></div></section>
